<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081c2d" />
    <meta name="google-site-verification" content="fC0RL8-q9GDN8OFknq-qEvZ18Si8u5Lq3BWhAZ3W_q4" />

    <!-- Static head. These are what a crawler sees without running JS, so they
         mirror the home page values and stay inside the ~60/160 character
         limits search results show. usePageMeta rewrites them per route. -->
    <title>Skyward Invexa | AI Trading Platform for Australians</title>
    <meta
      name="description"
      content="Skyward Invexa is an AI trading platform built for Australians. It scans markets 24/7, shows trade signals and runs in your browser, with no app needed."
    />
    <link rel="canonical" href="https://skywardinvexa-au.com/" />

    <!-- Open Graph. Per-page values are rewritten by usePageMeta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skyward Invexa" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:title" content="Skyward Invexa | AI Trading Platform for Australians" />
    <meta
      property="og:description"
      content="An AI trading platform built for Australians. It scans markets 24/7, shows trade signals and runs in your browser, with no app needed."
    />
    <meta property="og:url" content="https://skywardinvexa-au.com/" />
    <meta property="og:image" content="https://skywardinvexa-au.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Skyward Invexa — multi-asset market access for Australian investors."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skyward Invexa | AI Trading Platform for Australians" />
    <meta
      name="twitter:description"
      content="An AI trading platform built for Australians. It scans markets 24/7, shows trade signals and runs in your browser, with no app needed."
    />
    <meta name="twitter:image" content="https://skywardinvexa-au.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://skywardinvexa-au.com/#organization",
            "name": "Skyward Invexa",
            "url": "https://skywardinvexa-au.com/",
            "logo": "https://skywardinvexa-au.com/og-image.png",
            "description": "AI trading platform built for Australian investors.",
            "areaServed": { "@type": "Country", "name": "Australia" },
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": "support@skywardinvexa-au.com",
                "areaServed": "AU",
                "availableLanguage": "en-AU"
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://skywardinvexa-au.com/#website",
            "url": "https://skywardinvexa-au.com/",
            "name": "Skyward Invexa",
            "inLanguage": "en-AU",
            "publisher": { "@id": "https://skywardinvexa-au.com/#organization" }
          }
        ]
      }
    </script>
    <!-- Google Analytics. The init is a local file rather than an inline block
         so the Content-Security-Policy in vercel.json can keep script-src
         without 'unsafe-inline'. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7WL8TB0TXE"></script>
    <script src="/gtag-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
